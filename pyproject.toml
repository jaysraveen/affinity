[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jaysraveen-affinity"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对请求亲和性路由相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "jaysraveen" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://jaysraveen.github.io"
Repository = "https://github.com/jaysraveen/affinity"
Issues = "https://github.com/jaysraveen/affinity/issues"

[project.scripts]
affinity = "affinity:main"

[tool.setuptools]
py-modules = ["affinity"]
